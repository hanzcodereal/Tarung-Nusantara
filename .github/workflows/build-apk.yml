name: Build APK Release

# Hanya berjalan bila dijalankan manual dari tab Actions (tombol "Run workflow").
on:
  workflow_dispatch:
    inputs:
      catatan:
        description: "Catatan build (opsional, hanya untuk riwayat)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    name: Build APK release 1.0.0
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Pasang JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Pasang Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Pasang komponen Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0"

      - name: Siapkan keystore penandatangan
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          KS="$RUNNER_TEMP/release.keystore"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Memakai keystore dari GitHub Secrets."
            echo "$KEYSTORE_BASE64" | base64 -d > "$KS"
            SP="$KEYSTORE_PASSWORD"; KA="$KEY_ALIAS"; KP="$KEY_PASSWORD"
          else
            echo "Secrets keystore tidak ada. Membuat keystore baru khusus build ini."
            echo "APK dari build ini tidak bisa dipasang sebagai pembaruan di atas APK dari build lain."
            SP="$(openssl rand -hex 16)"; KA="tarung"; KP="$SP"
            echo "::add-mask::$SP"
            keytool -genkeypair -keystore "$KS" -alias "$KA" -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$SP" -keypass "$KP" -dname "CN=Hanz Dev Official, O=Hanz Dev Official, C=ID"
          fi
          {
            echo "KEYSTORE_PATH=$KS"
            echo "KEYSTORE_PASSWORD=$SP"
            echo "KEY_ALIAS=$KA"
            echo "KEY_PASSWORD=$KP"
          } >> "$GITHUB_ENV"

      - name: Build APK release
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Verifikasi tanda tangan APK
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          ls -l "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$APK"

      - name: Beri nama APK
        run: cp app/build/outputs/apk/release/app-release.apk TarungNusantara-1.0.0-release.apk

      - name: Unggah APK
        uses: actions/upload-artifact@v4
        with:
          name: TarungNusantara-1.0.0-release-apk
          path: TarungNusantara-1.0.0-release.apk
          if-no-files-found: error
          retention-days: 30
